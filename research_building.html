<!DOCTYPE html>
<html lang="ja">
  <head>
    <meta charset="UTF-8">
    <link rel="stylesheet" href="./university_grounds_style.css">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>新大マップ</title>

    <link
    rel="stylesheet"
    href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
    >

  </head>
  <body>
    <h1>新大マップ</h1>
     <!-- 階数切り替え -->
  <div class="floor-buttons">
    <button onclick="changeFloor(1)">1階</button>
    <button onclick="changeFloor(2)">2階</button>
    <button onclick="changeFloor(3)">3階</button>
    <button onclick="changeFloor(4)">4階</button>
    <button onclick="changeFloor(5)">5階</button>
  </div>

  <div id="map"></div>
   
<!--出発地点と目的地設定-->
<div class="route-box">
  <label>出発地</label>
  <input
    type="text"
    id="startInput"
    placeholder="入力してください"
  >

  <label>目的地</label>
  <input
    type="text"
    id="goalInput"
    placeholder="入力してください"
  >

  <button id="routeButton">経路を表示</button>
  <button id="clearRouteButton">経路を消去</button>

  <div id="routeMessage"></div>

</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

<!-- 各階のデータ -->
<script src="1st_Floor_Map.js"></script>
<script src="2nd_Floor_Map.js"></script>
<script src="3rd_Floor_Map.js"></script>
<script src="4th_Floor_Map.js"></script>
<script src="5th_Floor_Map.js"></script>

<!-- 階数間の接続データ -->
<script src="floor_connections.js"></script>

<!-- マップ・経路処理 -->
<script src="script.js"></script>

<!-- 敷地内マップへ戻るボタン -->
<a href="./campus.html" class="back-button">
  ← 敷地内マップへ戻る
</a>
   
  </body>
</html>
